# Advanced prompt configuration with versioning and A/B testing support
version: "1.0"
default_version: "v1"

# Story generation prompts with different versions
story_generation:
  v1:
    system_prompt: |
      You will be provided with a prompt to generate a story.
      The story should be coherent, engaging, and follow the given parameters.
      if the genre is nsfw, then do not generate the story. Reply with a message saying "NSFW content is not allowed".
      The story should be suitable for all audiences.
      The story should be structured with a clear beginning, middle, and end.
      Each paragraph should be well-formed and contribute to the overall narrative.
    
    user_prompt_template: |
      Write a {genre} story with {char_desc}. Each paragraph should have {paragraph_length} sentences.
  
  v2:
    system_prompt: |
      You are a creative storyteller. Generate an engaging story based on the user's requirements.
      
      IMPORTANT RULES:
      - If the genre is NSFW or inappropriate, respond with: "NSFW content is not allowed"
      - Keep content suitable for all ages
      - Create a story with clear structure: beginning, middle, and end
      - Make each paragraph meaningful and well-connected
      - Use vivid descriptions and engaging dialogue where appropriate
    
    user_prompt_template: |
      Create a captivating {genre} story featuring {char_desc}. 
      Structure: Each paragraph must contain exactly {paragraph_length} sentences.
      Make the story immersive and entertaining.

# Story validation prompts
story_validation:
  v1:
    system_prompt_template: |
      You will be provided with a story and your task is to validate the following. 
          1. The story should be of this genre: {genre}
          2. The story should have {characters} characters.
          3. Each paragraph should have {paragraph_length} sentences.
      If the story does not meet these criteria, reply with a message just Y or N 
  
  v2:
    system_prompt_template: |
      Analyze the provided story and validate these requirements:
      
      ✓ Genre: Must be {genre}
      ✓ Characters: Must include {characters} characters
      ✓ Structure: Each paragraph must have exactly {paragraph_length} sentences
      
      Respond with only 'Y' if ALL criteria are met, or 'N' if ANY criterion fails.

# Model configurations for different use cases
model_config:
  default:
    model_name: "Qwen/Qwen3-32B"
    temperature: 0.7
    top_p: 0.8
    max_tokens: 1024
  
  creative:
    model_name: "Qwen/Qwen3-32B"
    temperature: 0.9
    top_p: 0.9
    max_tokens: 1500
  
  precise:
    model_name: "Qwen/Qwen3-32B"
    temperature: 0.3
    top_p: 0.6
    max_tokens: 800

# A/B testing configuration
ab_testing:
  enabled: true
  experiments:
    - name: "prompt_style"
      traffic_split: 50  # percentage of traffic to new version
      control: "v1"
      variant: "v2"
      metrics: ["response_quality", "user_satisfaction"]
    
    - name: "model_creativity"
      traffic_split: 30
      control: "default"
      variant: "creative"
      metrics: ["creativity_score", "engagement"]

# Internationalization support
i18n:
  default_language: "en"
  supported_languages: ["en", "es", "fr", "de"]
  
  translations:
    en:
      nsfw_message: "NSFW content is not allowed"
      validation_failed: "The generated story does not meet the specified criteria"
    
    es:
      nsfw_message: "No se permite contenido NSFW"
      validation_failed: "La historia generada no cumple con los criterios especificados"
